appId: com.mushr.mailuo
productName: 脉络
directories:
  buildResources: build
  output: release
artifactName: Mailuo-${version}-${os}-${arch}.${ext}
files:
  - out/**
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asarUnpack:
  - node_modules/@earendil-works/**
  - node_modules/jiti/**
  - node_modules/.pnpm/jiti@*/node_modules/jiti/**
  - node_modules/.pnpm/@babel+*/node_modules/@babel/**
  - node_modules/.pnpm/babel*/**
  - node_modules/.pnpm/esbuild@*/node_modules/esbuild/**
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  extendInfo:
    NSCameraUsageDescription: 脉络内置浏览器需要相机权限以支持网页扫码和视频功能。
    NSMicrophoneUsageDescription: 脉络内置浏览器需要麦克风权限以支持网页通话和录音功能。
    NSLocationWhenInUseUsageDescription: 脉络仅在网页明确请求且你允许时使用位置信息。
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  category: Office
  target:
    - AppImage
    - deb
npmRebuild: false
