appId: com.mushr.mailuo
productName: 脉络
directories:
  buildResources: build
  output: release
artifactName: Mailuo-${version}-${os}-${arch}.${ext}
files:
  - out/**
asarUnpack:
  - node_modules/@earendil-works/**
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
npmRebuild: false
