name: Build and release desktop apps

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0 or 0.2.0-beta.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  prepare_release:
    name: Update version and create tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      tag: ${{ steps.release_version.outputs.tag }}
      version_changed: ${{ steps.release_version.outputs.version_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release version
        id: release_version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be started from the main branch." >&2
            exit 1
          fi

          git pull --ff-only origin main

          RELEASE_VERSION="${REQUESTED_VERSION#v}"
          SEMVER_PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

          if [[ ! "$RELEASE_VERSION" =~ $SEMVER_PATTERN ]]; then
            echo "Invalid semantic version: $REQUESTED_VERSION" >&2
            exit 1
          fi

          RELEASE_TAG="v$RELEASE_VERSION"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists." >&2
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package version
        if: steps.release_version.outputs.version_changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: pnpm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Commit version and push tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
          VERSION_CHANGED: ${{ steps.release_version.outputs.version_changed }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$VERSION_CHANGED" == "true" ]]; then
            git add package.json pnpm-lock.yaml
            git commit -m "chore: release $RELEASE_TAG"
          fi
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"

  package:
    name: Package ${{ matrix.name }}
    needs: prepare_release
    if: >-
      ${{
        always() &&
        (needs.prepare_release.result == 'success' ||
        needs.prepare_release.result == 'skipped')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            build_args: --mac --arm64
            artifact_name: mailuo-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            build_args: --mac --x64
            artifact_name: mailuo-macos-x64
          - name: Windows
            os: windows-latest
            build_args: --win --x64
            artifact_name: mailuo-windows-x64
          - name: Linux
            os: ubuntu-latest
            build_args: --linux --x64
            artifact_name: mailuo-linux-x64

    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_release.outputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            startsWith(github.ref, 'refs/tags/v')
          }}
        env:
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag || github.ref_name }}
        run: >-
          node -e "const pkg = require('./package.json');
          const expected = process.env.RELEASE_TAG.replace(/^v/, '');
          if (pkg.version !== expected) {
          console.error('Tag and package.json versions differ:', process.env.RELEASE_TAG, pkg.version);
          process.exit(1);
          }"

      - name: Build application
        run: pnpm build

      - name: Package application
        run: pnpm exec electron-builder ${{ matrix.build_args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  publish_release:
    name: Publish GitHub Release
    needs:
      - prepare_release
      - package
    if: >-
      ${{
        always() &&
        needs.package.result == 'success' &&
        (github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare_release.outputs.tag || github.ref_name }}

    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v5
        with:
          pattern: mailuo-*
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: ls -lh release-assets

      - name: Create release and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            exit 0
          fi

          RELEASE_FLAGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "脉络 $RELEASE_TAG" \
            --generate-notes \
            "${RELEASE_FLAGS[@]}"
