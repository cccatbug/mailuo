name: Package desktop apps

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            build_args: --mac --arm64
            artifact_name: mailuo-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            build_args: --mac --x64
            artifact_name: mailuo-macos-x64
          - name: Windows
            os: windows-latest
            build_args: --win --x64
            artifact_name: mailuo-windows-x64
          - name: Linux
            os: ubuntu-latest
            build_args: --linux --x64
            artifact_name: mailuo-linux-x64

    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Package application
        run: pnpm exec electron-builder ${{ matrix.build_args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30
