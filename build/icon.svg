<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Mailuo flower icon</title>
  <desc id="desc">A lively pink flower bud growing from green grass under a blue sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66c9ff"/>
      <stop offset="1" stop-color="#b9ecff"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66cc68"/>
      <stop offset="1" stop-color="#32a95c"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43b963"/>
      <stop offset="1" stop-color="#16844c"/>
    </linearGradient>
    <linearGradient id="petalLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff96bd"/>
      <stop offset="1" stop-color="#ef4f91"/>
    </linearGradient>
    <linearGradient id="petalRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff81b0"/>
      <stop offset="1" stop-color="#db377f"/>
    </linearGradient>
    <linearGradient id="petalCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc0d6"/>
      <stop offset="1" stop-color="#f45c9a"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#075b4a" flood-opacity=".2"/>
    </filter>
    <clipPath id="roundedTile">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedTile)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="790" cy="230" r="92" fill="#fff4a8" opacity=".9"/>
    <circle cx="790" cy="230" r="126" fill="none" stroke="#fff" stroke-width="18" opacity=".18"/>

    <path d="M-80 700C105 578 246 612 386 676C537 745 683 620 805 596C908 576 1010 618 1096 684V1092H-80Z" fill="url(#hillBack)"/>
    <path d="M-75 788C94 666 238 700 357 766C474 831 584 779 693 719C820 650 965 700 1100 809V1090H-75Z" fill="url(#hillFront)"/>

    <g filter="url(#softShadow)">
      <path d="M513 805C503 689 511 567 523 452" fill="none" stroke="#126f49" stroke-width="42" stroke-linecap="round"/>
      <path d="M510 782C503 681 510 568 522 465" fill="none" stroke="#2ead64" stroke-width="23" stroke-linecap="round"/>

